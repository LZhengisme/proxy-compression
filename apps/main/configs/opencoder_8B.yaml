dump_dir: "./checkpoints"
log_dump_dir: "./checkpoints"
name: opencoder_8B
steps: 60_000
probe_freq: null
seed: 42

optim:
    lr: 3e-4
    weight_decay: 0.1
    epsilon: 1e-15
    beta1: 0.9
    beta2: 0.95
    warmup: 2000
    clip: 1.0
    scheduler: wsd
    decay_fraction: 0.0

distributed:
    dp_shard: 8
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: true
    sac_config: 
        mode: full
        selective_ac_option: 1
    tp_size: 1

model:
    dim: 4096
    ffn_dim: 14336
    n_layers: 32
    n_heads: 32
    n_kv_heads: 8
    vocab_size: 96640
    init_base_std: 0.02
    rope_theta: 500000

data:
    root_dir: data
    sources:
        opencoder: 1.0
    batch_size: 4
    prefetch_size: 64
    seq_len: 4096
    n_views: 2
    load_async: true
    add_bos: true
    add_eos: true
    tokenizer:
        name: vanilla_hf
        path: infly/OpenCoder-1.5B-Base

profiling:
    run: false

checkpoint:
    dump:
        every: 1000
        keep: 0

logging:
    freq: 10
